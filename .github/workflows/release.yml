# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Grafana signing token
        env:
          GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
        run: |
          if [ -z "$GRAFANA_ACCESS_POLICY_TOKEN" ]; then
            echo "GRAFANA_ACCESS_POLICY_TOKEN must be configured to publish a signed plugin" >&2
            exit 1
          fi

      - uses: grafana/plugin-actions/build-plugin@8b12a2d6fa5fc0939a6bf75905453d4b505ef29a # build-plugin/v1.2.0
        id: build-plugin
        with:
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}

      # The packaged plugin must pass the official Grafana plugin validator
      # before release. build-plugin creates the
      # GitHub release as a DRAFT whose body tells the maintainer to check
      # this "Validate plugin" step before publishing — publish only when it
      # is green. The full analyzer suite runs on the signed archive (CI runs
      # only metadatavalid, because PR artifacts are unsigned and would fail
      # the signature analyzers).
      - name: Validate plugin
        run: |
          docker run --pull=always \
            -v "$PWD/${ARCHIVE}:/archive.zip" \
            grafana/plugin-validator-cli /archive.zip
        env:
          ARCHIVE: ${{ steps.build-plugin.outputs.archive }}
