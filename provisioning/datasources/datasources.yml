# Provisioned for the local dev stack (docker-compose.yaml):
# OpenObserve at http://openobserve:5080, bootstrapped with the root user
# credentials set in the compose file.
apiVersion: 1

datasources:
  - name: 'OpenObserve Traces'
    uid: openobserve-traces-local
    type: 'gresearch-openobservetraces-datasource'
    access: proxy
    url: http://openobserve:5080
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    basicAuth: true
    basicAuthUser: root@example.com
    jsonData:
      orgId: default
      defaultStream: default
      nodeGraph: true
    secureJsonData:
      basicAuthPassword: Complexpass#123
